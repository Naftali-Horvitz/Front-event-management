<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
    <!-- רקע -->
    <rect x="50" y="50" width="300" height="100" fill="#4A6FA5" rx="50" />
    
    <!-- אייקון עיגול עם סמל קליק מהגרסה הראשונה -->
    <circle cx="120" cy="100" r="25" fill="#8D99AE" />
    <path d="M105 100 L120 115 L140 85" stroke="white" stroke-width="4" fill="none" />
    
    <!-- טקסט בסגנון של הגרסה הראשונה -->
    <text x="165" y="95" font-family="Arial, sans-serif" font-size="22" fill="white">ניהול אירועים</text>
    <text x="165" y="125" font-family="Arial, sans-serif" font-size="28" fill="#8D99AE" font-weight="bold">בקליק</text>
    
    <!-- קווים דקורטיביים -->
    <line x1="300" y1="75" x2="320" y2="75" stroke="white" stroke-width="2" />
    <line x1="300" y1="85" x2="320" y2="85" stroke="white" stroke-width="2" />
    <line x1="300" y1="95" x2="320" y2="95" stroke="white" stroke-width="2" />
</svg>